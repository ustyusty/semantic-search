<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка — Семантический поиск</title>
  <style>
    :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --card:#181b22; --accent:#7aa2ff; --border:#242833; --ok:#6ee7b7; --err:#fca5a5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 80px; }
    .top { display:flex; justify-content:space-between; align-items:baseline; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    .backlink { color: var(--muted); text-decoration: none; font-size: 13px; }
    .backlink:hover { color: var(--accent); }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .tabs { display:flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 14px; }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
    input[type="text"], input[type="file"], textarea { width:100%; padding:12px 14px; font-size:15px; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; outline:none; font-family:inherit; }
    textarea { min-height: 180px; resize: vertical; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    label { display:block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    button { padding: 0 20px; min-height: 44px; font-size:15px; background:var(--accent); color:#0b0d12; border:0; border-radius:10px; cursor:pointer; font-weight:600; width: 100%; margin-top: 16px; }
    button:disabled { opacity:.5; cursor:wait; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .status { margin-top: 12px; font-size: 14px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .mode-block { display: none; }
    .mode-block.active { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Админка</h1>
      <a class="backlink" href="/">← к поиску</a>
    </div>
    <p class="sub">Добавление документов в базу знаний. Только для администраторов.</p>

    <div class="tabs">
      <div class="tab active" data-mode="text">Текст</div>
      <div class="tab" data-mode="pdf">PDF-файл</div>
    </div>

    <form id="addForm" class="mode-block active" data-mode="text">
      <label for="title">Заголовок</label>
      <input id="title" type="text" placeholder="Например: Инструкция по оформлению отпуска" required />
      <label for="block">Раздел (необязательно)</label>
      <input id="block" type="text" placeholder="Например: HR" />
      <label for="content">Текст документа</label>
      <textarea id="content" placeholder="Вставьте сюда полный текст инструкции..." required></textarea>
      <button id="addBtn" type="submit">Сохранить в базу знаний</button>
    </form>

    <form id="pdfForm" class="mode-block" data-mode="pdf">
      <label for="pdfTitle">Заголовок (необязательно, по умолчанию — имя файла)</label>
      <input id="pdfTitle" type="text" placeholder="Оставьте пустым, чтобы взять из имени PDF" />
      <label for="pdfBlock">Раздел (необязательно)</label>
      <input id="pdfBlock" type="text" placeholder="Например: HR" />
      <label for="pdfFile">PDF-файл (до 15 МБ, с извлекаемым текстом)</label>
      <input id="pdfFile" type="file" accept="application/pdf,.pdf" required />
      <button id="pdfBtn" type="submit">Загрузить PDF</button>
    </form>

    <div class="meta" id="meta"></div>
    <div class="status" id="addStatus"></div>
  </div>

  <script>
    const meta = document.getElementById('meta');
    async function refreshCount() {
      try {
        const r = await fetch('/api/documents/count');
        const d = await r.json();
        meta.textContent = `В базе знаний документов: ${d.count}`;
      } catch {}
    }
    refreshCount();

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.mode-block').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.querySelector(`.mode-block[data-mode="${t.dataset.mode}"]`).classList.add('active');
        document.getElementById('addStatus').textContent = '';
      });
    });

    const addStatus = document.getElementById('addStatus');

    const addForm = document.getElementById('addForm');
    const addBtn = document.getElementById('addBtn');
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const block = document.getElementById('block').value.trim() || null;
      if (!title || !content) return;
      addBtn.disabled = true;
      addStatus.className = 'status';
      addStatus.textContent = 'Сохраняю и считаю эмбеддинг…';
      try {
        const r = await fetch('/api/documents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, block }),
        });
        if (!r.ok) throw new Error(await extractError(r));
        const d = await r.json();
        addStatus.className = 'status ok';
        addStatus.textContent = `Документ добавлен (id=${d.id})`;
        addForm.reset();
        refreshCount();
      } catch (err) {
        addStatus.className = 'status err';
        addStatus.textContent = 'Ошибка: ' + String(err.message || err);
      } finally {
        addBtn.disabled = false;
      }
    });

    const pdfForm = document.getElementById('pdfForm');
    const pdfBtn = document.getElementById('pdfBtn');
    pdfForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('pdfFile').files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const t = document.getElementById('pdfTitle').value.trim();
      const b = document.getElementById('pdfBlock').value.trim();
      if (t) fd.append('title', t);
      if (b) fd.append('block', b);
      pdfBtn.disabled = true;
      addStatus.className = 'status';
      addStatus.textContent = 'Извлекаю текст из PDF и считаю эмбеддинг…';
      try {
        const r = await fetch('/api/documents/upload', { method: 'POST', body: fd });
        if (!r.ok) throw new Error(await extractError(r));
        const d = await r.json();
        addStatus.className = 'status ok';
        addStatus.textContent = `PDF добавлен (id=${d.id})`;
        pdfForm.reset();
        refreshCount();
      } catch (err) {
        addStatus.className = 'status err';
        addStatus.textContent = 'Ошибка: ' + String(err.message || err);
      } finally {
        pdfBtn.disabled = false;
      }
    });

    async function extractError(r) {
      let msg = await r.text();
      try { msg = JSON.parse(msg).detail || msg; } catch {}
      return msg;
    }
  </script>
</body>
</html>

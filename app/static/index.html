<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Семантический поиск по базе знаний</title>
  <style>
    :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --card:#181b22; --accent:#7aa2ff; --border:#242833; --ok:#6ee7b7; --err:#fca5a5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .tabs { display:flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 14px; }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
    .pane { display: none; }
    .pane.active { display: block; }
    .row { display:flex; gap:8px; }
    input[type="text"], textarea { width:100%; padding:12px 14px; font-size:15px; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; outline:none; font-family:inherit; }
    textarea { min-height: 180px; resize: vertical; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    label { display:block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    button { padding: 0 20px; min-height: 44px; font-size:15px; background:var(--accent); color:#0b0d12; border:0; border-radius:10px; cursor:pointer; font-weight:600; }
    button.full { width: 100%; margin-top: 16px; }
    button:disabled { opacity:.5; cursor:wait; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 16px; }
    .results { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
    .card h3 { margin: 0 0 6px; font-size:17px; }
    .card .block { color:var(--muted); font-size: 12px; margin-bottom: 8px; }
    .card .snippet { font-size: 14px; line-height: 1.5; color:#d0d4db; white-space:pre-wrap; }
    .card .score { float:right; color:var(--accent); font-size:12px; }
    .empty { color: var(--muted); font-style: italic; }
    .status { margin-top: 12px; font-size: 14px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Семантический поиск</h1>
    <p class="sub">База знаний с поиском по смыслу. Формулируйте запрос на естественном языке.</p>

    <div class="tabs">
      <div class="tab active" data-pane="search">Поиск</div>
      <div class="tab" data-pane="add">Добавить документ</div>
    </div>

    <div class="pane active" id="pane-search">
      <form class="row" id="form">
        <input id="q" type="text" placeholder='Например: "как оформить отпуск" или "сломался принтер"' autocomplete="off" />
        <button id="go" type="submit">Найти</button>
      </form>
      <div class="meta" id="meta"></div>
      <div class="results" id="results"></div>
    </div>

    <div class="pane" id="pane-add">
      <form id="addForm">
        <label for="title">Заголовок</label>
        <input id="title" type="text" placeholder="Например: Инструкция по оформлению отпуска" required />
        <label for="block">Раздел (необязательно)</label>
        <input id="block" type="text" placeholder="Например: HR" />
        <label for="content">Текст документа</label>
        <textarea id="content" placeholder="Вставьте сюда полный текст инструкции..." required></textarea>
        <button class="full" id="addBtn" type="submit">Сохранить в базу знаний</button>
      </form>
      <div class="status" id="addStatus"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('q');
    const btn = document.getElementById('go');
    const results = document.getElementById('results');
    const meta = document.getElementById('meta');

    async function refreshCount() {
      try {
        const r = await fetch('/api/documents/count');
        const d = await r.json();
        meta.textContent = `В базе знаний документов: ${d.count}`;
      } catch {}
    }
    refreshCount();

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('pane-' + t.dataset.pane).classList.add('active');
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      btn.disabled = true;
      results.innerHTML = '<div class="empty">Ищу…</div>';
      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&k=3`);
        if (!r.ok) throw new Error(await r.text());
        const hits = await r.json();
        if (!hits.length) { results.innerHTML = '<div class="empty">Ничего не найдено. Сначала добавьте документы на вкладке «Добавить документ».</div>'; return; }
        results.innerHTML = hits.map(h => `
          <div class="card">
            <span class="score">${h.score.toFixed(3)}</span>
            <h3>${escapeHtml(h.title)}</h3>
            ${h.block ? `<div class="block">${escapeHtml(h.block)}</div>` : ''}
            <div class="snippet">${escapeHtml(h.snippet)}</div>
          </div>
        `).join('');
      } catch (err) {
        results.innerHTML = `<div class="empty">Ошибка: ${escapeHtml(String(err))}</div>`;
      } finally {
        btn.disabled = false;
      }
    });

    const addForm = document.getElementById('addForm');
    const addBtn = document.getElementById('addBtn');
    const addStatus = document.getElementById('addStatus');
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const block = document.getElementById('block').value.trim() || null;
      if (!title || !content) return;
      addBtn.disabled = true;
      addStatus.className = 'status';
      addStatus.textContent = 'Сохраняю и считаю эмбеддинг…';
      try {
        const r = await fetch('/api/documents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, block }),
        });
        if (!r.ok) throw new Error(await r.text());
        const d = await r.json();
        addStatus.className = 'status ok';
        addStatus.textContent = `Документ добавлен (id=${d.id})`;
        addForm.reset();
        refreshCount();
      } catch (err) {
        addStatus.className = 'status err';
        addStatus.textContent = 'Ошибка: ' + String(err);
      } finally {
        addBtn.disabled = false;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Семантический поиск — Орион Технолоджис</title>
  <style>
    :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --card:#181b22; --accent:#7aa2ff; --border:#242833; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.sub { color: var(--muted); margin: 0 0 28px; }
    .searchbox { display:flex; gap:8px; }
    input[type="text"] { flex:1; padding:14px 16px; font-size:16px; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; outline:none; }
    input[type="text"]:focus { border-color: var(--accent); }
    button { padding: 0 20px; font-size:15px; background:var(--accent); color:#0b0d12; border:0; border-radius:10px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:wait; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 16px; }
    .results { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
    .card h3 { margin: 0 0 6px; font-size:17px; }
    .card .block { color:var(--muted); font-size: 12px; margin-bottom: 8px; }
    .card .snippet { font-size: 14px; line-height: 1.5; color:#d0d4db; white-space:pre-wrap; }
    .card .score { float:right; color:var(--accent); font-size:12px; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Семантический поиск</h1>
    <p class="sub">База знаний ООО «Орион Технолоджис». Сформулируйте запрос своими словами.</p>
    <form class="searchbox" id="form">
      <input id="q" type="text" placeholder='Например: "хочу отдохнуть" или "сломался принтер"' autocomplete="off" />
      <button id="go" type="submit">Найти</button>
    </form>
    <div class="meta" id="meta"></div>
    <div class="results" id="results"></div>
  </div>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('q');
    const btn = document.getElementById('go');
    const results = document.getElementById('results');
    const meta = document.getElementById('meta');

    fetch('/api/documents/count').then(r => r.json()).then(d => {
      meta.textContent = `В базе знаний документов: ${d.count}`;
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      btn.disabled = true;
      results.innerHTML = '<div class="empty">Ищу…</div>';
      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&k=3`);
        if (!r.ok) throw new Error(await r.text());
        const hits = await r.json();
        if (!hits.length) { results.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
        results.innerHTML = hits.map(h => `
          <div class="card">
            <span class="score">${h.score.toFixed(3)}</span>
            <h3>${escapeHtml(h.title)}</h3>
            ${h.block ? `<div class="block">${escapeHtml(h.block)}</div>` : ''}
            <div class="snippet">${escapeHtml(h.snippet)}</div>
          </div>
        `).join('');
      } catch (err) {
        results.innerHTML = `<div class="empty">Ошибка: ${escapeHtml(String(err))}</div>`;
      } finally {
        btn.disabled = false;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
